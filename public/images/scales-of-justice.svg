<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Ornate scales of justice">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#171614"/>
      <stop offset="100%" stop-color="#050504"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efede7"/>
      <stop offset="45%" stop-color="#c2c0b8"/>
      <stop offset="100%" stop-color="#888882"/>
    </linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcdad3" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#6f6f6a" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <g stroke="url(#sheen)" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- top finial -->
    <path d="M100 10 v8" stroke-width="1"/>
    <path d="M100 9.5 104.2 16 h-8.4z" stroke-width="1"/>
    <path d="M96.5 19 h7" stroke-width="1"/>
    <path d="M96 22 a4 5 0 0 0 8 0" stroke-width="1"/>
    <path d="M100 30 v5" stroke-width="1"/>
    <circle cx="100" cy="37.4" r="2.6" stroke-width="1"/>
    <path d="M100 41 v5" stroke-width="1"/>

    <!-- hub rosette -->
    <circle cx="100" cy="50" r="7" stroke-width="1.1"/>
    <circle cx="100" cy="50" r="2.2" stroke-width="1"/>

    <!-- crossbar -->
    <path d="M40 46 h120" stroke-width="1.3"/>
    <path d="M40 54 h120" stroke-width="1.3"/>
    <path d="M58 50 l2.2 -2 2.2 2 -2.2 2 z" stroke-width=".9"/>
    <path d="M78 50 l2.2 -2 2.2 2 -2.2 2 z" stroke-width=".9"/>
    <path d="M122 50 l2.2 -2 2.2 2 -2.2 2 z" stroke-width=".9"/>
    <path d="M142 50 l2.2 -2 2.2 2 -2.2 2 z" stroke-width=".9"/>

    <!-- scrollwork near hub -->
    <path d="M87 46 c-4 -7 -12 1 -5 6 c4 3 7 -3 4 -6 c-1 -2 -4 -1 -4 1" stroke-width="1"/>
    <path d="M87 54 c-4 7 -12 -1 -5 -6 c4 -3 7 3 4 6 c-1 2 -4 1 -4 -1" stroke-width="1"/>
    <path d="M113 46 c4 -7 12 1 5 6 c-4 3 -7 -3 -4 -6 c1 -2 4 -1 4 1" stroke-width="1"/>
    <path d="M113 54 c4 7 12 -1 5 -6 c-4 -3 -7 3 -4 6 c1 2 4 1 4 -1" stroke-width="1"/>

    <!-- end volutes (above beam) -->
    <path d="M40 46 c-8 0 -8 9 0 9" stroke-width="1"/>
    <path d="M40 48 c-5 0 -5 5 0 5" stroke-width=".9"/>
    <circle cx="37.4" cy="50.5" r=".9" stroke-width=".8"/>
    <path d="M160 46 c8 0 8 9 0 9" stroke-width="1"/>
    <path d="M160 48 c5 0 5 5 0 5" stroke-width=".9"/>
    <circle cx="162.6" cy="50.5" r=".9" stroke-width=".8"/>

    <!-- end volutes (below beam) -->
    <path d="M40 54 c-8 0 -8 9 0 9" stroke-width="1"/>
    <path d="M40 55.5 c-5 0 -5 5 0 5" stroke-width=".9"/>
    <circle cx="37.4" cy="58.5" r=".9" stroke-width=".8"/>
    <path d="M160 54 c8 0 8 9 0 9" stroke-width="1"/>
    <path d="M160 55.5 c5 0 5 5 0 5" stroke-width=".9"/>
    <circle cx="162.6" cy="58.5" r=".9" stroke-width=".8"/>

    <!-- engraved column -->
    <path d="M96.5 54 v104" stroke-width="1.1"/>
    <path d="M103.5 54 v104" stroke-width="1.1"/>
    <path d="M98 62 h4" stroke-width=".9"/>
    <path d="M98 74 h4" stroke-width=".9"/>
    <path d="M98 86 h4" stroke-width=".9"/>
    <path d="M98 98 h4" stroke-width=".9"/>
    <path d="M98 110 h4" stroke-width=".9"/>
    <path d="M98 122 h4" stroke-width=".9"/>
    <path d="M98 134 h4" stroke-width=".9"/>
    <path d="M98 146 h4" stroke-width=".9"/>

    <!-- pedestal base -->
    <path d="M89 158 h22" stroke-width="1.1"/>
    <path d="M93 158 v8 h14 v-8" stroke-width="1"/>
    <path d="M87 166 h26" stroke-width="1.2"/>
    <path d="M100 166 v5" stroke-width="1"/>
    <path d="M87 166 l-2 6 h6 l-1 -6" stroke-width="1"/>
    <path d="M113 166 l2 6 h-6 l1 -6" stroke-width="1"/>

    <!-- left chain -->
    <path d="M36 54 v3" stroke-width="1"/>
    <path d="M33.5 57 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M33.5 63 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M33.5 69 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M33.5 75 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M33.5 81 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M33.5 87 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M36 90 v2" stroke-width="1"/>

    <!-- right chain -->
    <path d="M164 54 v3" stroke-width="1"/>
    <path d="M161.5 57 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M161.5 63 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M161.5 69 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M161.5 75 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M161.5 81 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M161.5 87 a2.5 3 0 0 0 5 0 a2.5 3 0 0 0 -5 0" stroke-width=".9"/>
    <path d="M164 90 v2" stroke-width="1"/>

    <!-- left pan -->
    <g fill="url(#pan)">
      <path d="M24 90 q0 15 12 15 t12 -15 z"/>
    </g>
    <path d="M24 90 h24" stroke-width="1.2"/>
    <path d="M24 90 q0 15 12 15 t12 -15" stroke-width="1.2"/>
    <path d="M27 92 q0 11 9 11" stroke-width=".9"/>
    <path d="M36 105 v3" stroke-width="1"/>
    <circle cx="36" cy="110.5" r="1.6" stroke-width=".9"/>

    <!-- right pan -->
    <g fill="url(#pan)">
      <path d="M176 90 q0 15 -12 15 t-12 -15 z"/>
    </g>
    <path d="M176 90 h-24" stroke-width="1.2"/>
    <path d="M176 90 q0 15 -12 15 t-12 -15" stroke-width="1.2"/>
    <path d="M173 92 q0 11 -9 11" stroke-width=".9"/>
    <path d="M164 105 v3" stroke-width="1"/>
    <circle cx="164" cy="110.5" r="1.6" stroke-width=".9"/>

  </g>
</svg>
